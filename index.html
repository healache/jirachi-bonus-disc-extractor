  Pokémon Colosseum Bonus Disc image (PC6E01 Rev.00).

  this project using technical information from Zaksabeast's 2023

<style>
  :root {
    color-scheme: dark light;
    --bg: #0a0a08;
    --bg-well: #050403;
    --fg: #f2ede0;
    --fg-dim: #b8b1a0;
    --accent: #e7b64c;
    --accent-text: var(--accent);
    --accent-ink: #171208;
    --accent-shadow: #96762f;
    --danger: #e2857c;
    --line: #37362c;
    --line-strong: #555344;
    --btn-bg: var(--fg);
    --btn-fg: var(--bg);
    --focus: var(--accent);
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", "Roboto Mono", Consolas, "Liberation Mono", monospace;
    --shell-width: 880px;
    --field-size: 13px;
  }

  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f2ede0;
      --bg-well: #e6ded0;
      --fg: #14110a;
      --fg-dim: #5c5645;
      --accent-text: #8a5c12;
      --danger: #a3352c;
      --line: #cfc7b2;
      --line-strong: #a39a81;
      --btn-bg: #14110a;
      --btn-fg: #f2ede0;
      --focus: var(--fg);
    }
  }

  * { box-sizing: border-box; }
  html.language-pending body { visibility: hidden; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.55;
  }

  a { color: var(--accent-text); }

  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }

  button, input {
    font: inherit;
    color: inherit;
  }

  button {
    cursor: pointer;
    background: none;
    border: 0;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  .shell {
    max-width: var(--shell-width);
    margin: 0 auto;
    padding: 2.5rem 1.25rem 3.5rem;
  }

  .masthead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
    border-bottom: 3px solid var(--fg);
    padding-bottom: 1.5rem;
    margin-bottom: 2rem;
  }

  .masthead__copy {
    min-width: 0;
    flex: 1 1 auto;
  }

  .masthead h1 {
    margin: 0 0 0.5rem;
    font-size: clamp(1.5rem, 3.8vw, 2.3rem);
    line-height: 1.15;
    letter-spacing: -0.01em;
  }

  .masthead p {
    margin: 0;
    color: var(--fg-dim);
    font-size: 0.92rem;
  }

  .sprite {
    flex: none;
    width: 144px;
    height: 144px;
    image-rendering: pixelated;
    filter: drop-shadow(4px 4px 0 var(--bg-well));
  }

  .lang-toggle {
    display: inline-block;
    margin-top: 0.85rem;
    padding: 0.25rem 0.55rem;
    border: 2px solid var(--line);
    color: var(--fg-dim);
    font-size: 0.78rem;
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .lang-toggle:hover,
  .lang-toggle:focus-visible {
    color: var(--fg);
    border-color: var(--accent);
  }

  section { margin-bottom: 2.25rem; }

  h2 {
    margin: 0 0 0.75rem;
    color: var(--accent-text);
    font-size: 0.9rem;
    font-weight: 700;
  }

  .dropzone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    gap: 0.5rem;
    padding: 2.5rem 1.5rem;
    border: 3px dashed var(--fg-dim);
    color: var(--fg-dim);
    background: transparent;
    text-align: center;
    transition: border-color 120ms ease, color 120ms ease, background 120ms ease;
  }

  .dropzone strong { color: var(--fg); font-size: 1.05rem; }
  .dropzone small { color: var(--fg-dim); }
  .dropzone:hover,
  .dropzone.is-active {
    border-color: var(--accent);
    color: var(--fg);
    background: rgb(231 182 76 / 8%);
  }

  #load-section[hidden],
  #results-section[hidden] { display: none; }

  .filename-line {
    display: none;
    margin: 0 0 0.65rem;
    overflow-wrap: anywhere;
    color: var(--fg-dim);
    font-size: 0.85rem;
  }

  .filename-line.is-visible { display: block; }

  .status {
    display: none;
    margin: 1rem 0 0;
    color: var(--danger);
    font-size: 0.95rem;
    font-weight: 700;
  }

  .status.is-visible { display: block; }

  #results-section {
    width: 100%;
    max-width: 840px;
    margin-inline: auto;
  }

  #results-heading { scroll-margin-block-start: 1rem; }

  .settings-panel {
    margin: 0 0 1.25rem;
    border: 2px solid var(--line-strong);
    background: var(--bg-well);
  }

  .settings-panel > summary {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.85rem 1rem;
    cursor: pointer;
    list-style: none;
  }

  .settings-panel > summary::-webkit-details-marker { display: none; }
  .settings-panel > summary::after { content: "+"; color: var(--accent-text); font-weight: 700; }
  .settings-panel[open] > summary::after { content: "−"; }
  .settings-panel > summary:hover,
  .settings-panel > summary:focus-visible { background: rgb(231 182 76 / 5%); }

  .settings-panel__title {
    font-weight: 700;
  }

  .settings-panel__current {
    color: var(--accent-text);
    font-size: 0.82rem;
    font-weight: 700;
  }

  .settings-panel__body {
    padding: 0 1rem 1rem;
    border-top: 2px solid var(--line);
  }

  .settings-panel__detail {
    margin: 0.85rem 0;
    color: var(--fg-dim);
    font-size: 0.78rem;
  }

  .choice-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    border: 2px solid var(--line);
  }

  .choice {
    position: relative;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 0.65rem;
    align-items: start;
    min-width: 0;
    padding: 0.9rem;
    border-left: 2px solid var(--line);
    cursor: pointer;
  }

  .choice:first-child { border-left: 0; }
  .choice:hover { background: rgb(231 182 76 / 5%); }
  .choice:focus-within { box-shadow: inset 0 0 0 3px var(--focus); }
  .choice:has(input:checked) { background: rgb(231 182 76 / 8%); box-shadow: inset 0 -4px 0 var(--accent); }

  .choice input {
    position: absolute;
    opacity: 0;
  }

  .choice__radio {
    width: 1rem;
    height: 1rem;
    margin-top: 0.2rem;
    border: 2px solid var(--fg-dim);
    border-radius: 50%;
  }

  .choice input:checked + .choice__radio {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 3px var(--bg-well), inset 0 0 0 7px var(--accent);
  }

  .choice__title { display: block; font-weight: 700; }
  .choice__detail { display: block; margin-top: 0.2rem; color: var(--fg-dim); font-size: 0.74rem; line-height: 1.45; }

  .rom-list {
    border-top: 3px solid var(--fg);
  }

  .rom-item {
    padding: 1.15rem 0 1.35rem;
    border-bottom: 2px solid var(--line);
  }

  .rom-item:last-child { border-bottom: 3px solid var(--fg); }

  .rom-item__main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(300px, 380px);
    align-items: center;
    gap: 1rem 1.25rem;
  }

  .rom-item__heading {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.6rem;
    min-width: 0;
  }

  .rom-item__name {
    min-width: 0;
    margin: 0;
    font-size: 1.1rem;
    line-height: 1.3;
  }

  .badge {
    flex: none;
    max-width: 100%;
    padding: 0.18rem 0.5rem;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 10.5px;
    font-weight: 700;
    line-height: 1.35;
    text-align: center;
  }

  .badge--muted {
    padding: calc(0.18rem - 2px) calc(0.5rem - 2px);
    border: 2px solid var(--line);
    background: transparent;
    color: var(--fg-dim);
  }

  .badge--unofficial {
    padding: calc(0.18rem - 2px) calc(0.5rem - 2px);
    border: 2px solid var(--danger);
    background: transparent;
    color: var(--danger);
  }

  .rom-item__download {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0.45rem;
    width: 100%;
    min-width: 0;
    justify-self: end;
  }

  .rom-item__download .btn { width: 100%; }

  .rom-item__disclosure {
    margin-top: 1rem;
    border: 2px solid var(--line);
    background: var(--bg-well);
  }

  .rom-item__disclosure > summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    width: 100%;
    padding: 0.7rem 0.85rem;
    cursor: pointer;
    color: var(--fg);
    font-size: 0.78rem;
    font-weight: 700;
    list-style: none;
  }

  .rom-item__disclosure > summary::-webkit-details-marker { display: none; }
  .rom-item__disclosure > summary::after {
    flex: none;
    content: "+";
    color: var(--accent-text);
    font-size: 1rem;
    font-weight: 700;
    line-height: 1;
  }
  .rom-item__disclosure[open] > summary {
    border-bottom: 2px solid var(--line);
  }
  .rom-item__disclosure[open] > summary::after { content: "−"; }
  .rom-item__disclosure > summary:hover { background: rgb(231 182 76 / 5%); }
  .rom-item__disclosure > summary:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: -3px;
  }

  .rom-item__details {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 0.8rem 1rem;
    margin: 0;
    padding: 0.85rem;
  }

  .fact { min-width: 0; margin: 0; }
  .fact dt { margin: 0; color: var(--fg-dim); font-size: 0.75rem; }
  .fact dd { margin: 0.08rem 0 0; font-size: var(--field-size); font-weight: 700; overflow-wrap: anywhere; }

  .shiny--possible { color: var(--accent-text); }
  .shiny--locked { color: var(--fg-dim); font-weight: 400 !important; }
  .shiny--unofficial { color: var(--danger); }

  .rom-item__options {
    grid-column: 1 / -1;
    margin-top: 0.15rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--line);
  }

  .check-choice {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 0.7rem;
    align-items: start;
    padding: 0.75rem;
    border: 2px solid var(--line);
    cursor: pointer;
  }

  .check-choice:hover { border-color: var(--line-strong); }
  .check-choice:focus-within { box-shadow: inset 0 0 0 3px var(--focus); }

  .check-choice input { width: 1.2rem; height: 1.2rem; margin: 0.12rem 0 0; accent-color: var(--accent); }
  .check-choice__title { display: block; font-weight: 700; }
  .check-choice__detail { display: block; margin-top: 0.2rem; color: var(--fg-dim); font-size: 0.75rem; line-height: 1.45; }

  .patch-warning {
    margin: 0.75rem 0 0;
    padding: 0.75rem;
    border: 3px solid var(--danger);
    color: var(--danger);
    font-size: 0.78rem;
    font-weight: 700;
    line-height: 1.5;
  }

  .raw-download {
    grid-column: 1 / -1;
    justify-self: start;
    margin-top: 0.05rem;
    color: var(--fg-dim);
    font-size: 0.76rem;
    text-underline-offset: 0.18em;
  }

  .btn {
    display: inline-flex;
    min-height: 46px;
    align-items: center;
    justify-content: center;
    padding: 0.62rem 0.9rem;
    border: 3px solid var(--btn-bg);
    background: var(--btn-bg);
    color: var(--btn-fg);
    box-shadow: 5px 5px 0 var(--accent-shadow);
    overflow-wrap: anywhere;
    font-weight: 700;
    text-decoration: none;
    transition: transform 80ms ease, box-shadow 80ms ease;
  }

  .btn:hover,
  .btn:focus-visible { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .btn:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 var(--accent-shadow); }
  .btn[disabled] { cursor: wait; opacity: 0.65; box-shadow: none; }

  .btn__copy { display: grid; gap: 0.08rem; text-align: center; }
  .btn__filename { font-size: 0.78em; font-weight: 700; }

  .actions {
    display: none;
    margin: 1.5rem 0 2.25rem;
    text-align: center;
  }

  .actions.is-visible { display: block; }

  @media (max-width: 820px) {
    .rom-item__main { grid-template-columns: 1fr; }
    .rom-item__download { width: min(100%, 380px); justify-self: start; }
  }

  @media (max-width: 700px) {
    .masthead { flex-direction: column-reverse; align-items: flex-start; }
    .sprite { width: 110px; height: 110px; }
    .choice-grid { grid-template-columns: 1fr; }
    .choice { border-left: 0; border-top: 2px solid var(--line); }
    .choice:first-child { border-top: 0; }
    .rom-item__details { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (prefers-reduced-motion: no-preference) {
    .rom-list.is-visible { animation: reveal 220ms ease-out; }
  }

  @keyframes reveal {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

  async function readBytes(file, offset, size) {
    const buffer = await file.slice(offset, offset + size).arrayBuffer();
    if (buffer.byteLength !== size) {
      throw new Error("short read");
    }
    return new Uint8Array(buffer);
  }

  async function readUint32BE(file, offset) {
    const bytes = await readBytes(file, offset, 4);
    return new DataView(bytes.buffer, bytes.byteOffset, 4).getUint32(0, false);
  }

  async function sha256Hex(bytes) {
    const digest = await crypto.subtle.digest("SHA-256", bytes);
    return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, "0")).join("");
  }

  function writeUint32LE(bytes, offset, value) {
    new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength).setUint32(offset, value >>> 0, true);
  }

  function retarget(word, instructionOffset, target) {
    return ((word & ~0xFFF) | ((target - instructionOffset - 8) & 0xFFF)) >>> 0;
  }

  function asR1(ldrR0Word) {
    return (ldrR0Word ^ R0_TO_R1_MASK) >>> 0;
  }

  function applyRelocatedPatch(bytes, checks, compressedOut) {
    const n = checks.length;
    const literalPool = OFF_CHECKS + (n * 3 + 2) * 4;
    const jump = OFF_CHECKS + n * 3 * 4;

    writeUint32LE(bytes, OFF_ADDR_FIXUP, retarget(LDR_R0_TEMPLATE, OFF_ADDR_FIXUP, literalPool));
    writeUint32LE(bytes, OFF_ADDR_FIXUP + 4, asR1(
      retarget(LDR_R0_TEMPLATE, OFF_ADDR_FIXUP + 4, literalPool + 4),
    ));

    let literal = literalPool + 8;
    let block = OFF_CHECKS;
    for (const [targetAddress, patchValue, storeWord] of checks) {
      writeUint32LE(bytes, block, retarget(LDR_R0_TEMPLATE, block, literal));
      writeUint32LE(bytes, block + 4, asR1(retarget(LDR_R0_TEMPLATE, block + 4, literal + 4)));
      writeUint32LE(bytes, block + 8, storeWord);
      writeUint32LE(bytes, literal, targetAddress);
      writeUint32LE(bytes, literal + 4, patchValue);
      block += 12;
      literal += 8;
    }

    writeUint32LE(bytes, jump, retarget(LDR_LR_TEMPLATE, jump, literalPool + 4));
    writeUint32LE(bytes, jump + 4, BX_LR);
    writeUint32LE(bytes, literalPool + 4, compressedOut);

    return literalPool;
  }

  async function patchRom(fileInfo, options) {
    const definition = PATCH_DEFINITIONS[fileInfo.patchId];
    if (!definition) throw new Error("patch-definition");

    if (fileInfo.sha256 !== definition.sha256) {
      throw new Error("hash-mismatch");
    }

    const rom = new Uint8Array(fileInfo.bytes);
    const checks = definition.checks.slice();
    if (fileInfo.supportsShinyUnlock && options.shinyUnlocked) {
      checks.push(definition.shinyCheck);
    }

    const literalPool = applyRelocatedPatch(
      rom,
      checks,
      definition.compressedOut,
    );

    writeUint32LE(
      rom,
      literalPool,
      options.mode === "multiboot" ? COMPRESSED_IN_MULTIBOOT : COMPRESSED_IN_EMULATOR,
    );

    return rom;
  }

  function makePatchedFilename(fileInfo, options) {
    const stem = fileInfo.name.replace(/\.bin$/i, "");
    const shiny = fileInfo.supportsShinyUnlock && options.shinyUnlocked ? "-shiny" : "";
    const target = options.mode === "multiboot" ? "multiboot" : "emulator";
    return `${stem}${shiny}-${target}.bin`;
  }

  async function readFileTableEntry(file, fileTableOffset, entryIndex) {
    const entryOffset = fileTableOffset + entryIndex * FST_ENTRY_SIZE;
    const bytes = await readBytes(file, entryOffset, FST_ENTRY_SIZE);
    const isDirectory = bytes[0] !== 0;
    const fileOffset = new DataView(bytes.buffer, bytes.byteOffset, FST_ENTRY_SIZE).getUint32(4, false);
    return { isDirectory, fileOffset };
  }

  async function verifyDiscImage(file) {
    const discMagic = await readUint32BE(file, DISC_MAGIC_OFFSET);
    if (discMagic !== DISC_MAGIC) throw new Error("not-gamecube");

    const fileTableOffset = await readUint32BE(file, FST_OFFSET_FIELD);
    if (fileTableOffset !== MAIN_FST_OFFSET) throw new Error("not-pc6e01");

    const fileTableBytes = await readBytes(file, MAIN_FST_OFFSET, MAIN_FST_SIZE);
    const fileTableHash = await sha256Hex(fileTableBytes);
    if (fileTableHash !== MAIN_FST_SHA256) throw new Error("not-pc6e01");

    const entry = await readFileTableEntry(file, MAIN_FST_OFFSET, TGC_ENTRY_INDEX);
    if (entry.isDirectory || entry.fileOffset !== TGC_OFFSET) throw new Error("not-pc6e01");

    const tgcMagic = await readUint32BE(file, TGC_OFFSET);
    if (tgcMagic !== TGC_MAGIC) throw new Error("not-pc6e01");
  }

  async function extractRomFiles(file) {
    for (const target of ROM_TARGETS) {
      if (target.offset + target.size > file.size) throw new Error("unreadable");
    }

    const extractedFiles = [];
    for (const target of ROM_TARGETS) {
      const bytes = await readBytes(file, target.offset, target.size);
      const hash = await sha256Hex(bytes);
      const expected = PATCH_DEFINITIONS[target.patchId]?.sha256;
      if (hash !== expected) throw new Error("hash-mismatch");
      extractedFiles.push({
        ...target,
        bytes,
        sha256: hash,
      });
    }
    return extractedFiles;
  }

  function createDownloadButton(fileInfo, label) {
    const button = document.createElement("button");

    button.setAttribute("aria-label", translate("ariaDownloadPatched", label, makePatchedFilename(fileInfo, {
      mode: outputState.mode,
      shinyUnlocked: fileInfo.supportsShinyUnlock && shinyUnlocked,
    })));

    copy.className = "btn__copy";

    title.dataset.role = "patched-download-title";
    title.textContent = translate("downloadPatched");
    const filename = document.createElement("span");
    filename.className = "btn__filename";
    filename.textContent = makePatchedFilename(fileInfo, {
      shinyUnlocked: fileInfo.supportsShinyUnlock && shinyUnlocked,
    });
    copy.append(title, filename);
    button.appendChild(copy);

    button.addEventListener("click", async () => {
      const options = {
        mode: outputState.mode,
        shinyUnlocked: fileInfo.supportsShinyUnlock && shinyUnlocked,
      };
      const buttonTitle = button.querySelector(".btn__copy > span:first-child");
      const buttonFilename = button.querySelector(".btn__filename");
      button.disabled = true;
      button.setAttribute("aria-busy", "true");
      if (buttonTitle) buttonTitle.textContent = translate("patching");
      if (buttonFilename) buttonFilename.hidden = true;

      try {
        const patchedBytes = await patchRom(fileInfo, options);
        const filename = makePatchedFilename(fileInfo, options);
        const blob = new Blob([patchedBytes], { type: "application/octet-stream" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = filename;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
        currentStatusKey = null;
        setStatus("");
      } catch (error) {
        currentStatusKey = error instanceof Error && error.message === "hash-mismatch"
          ? "hashMismatch"
          : "patchFailed";
        setStatus(translate(currentStatusKey));
      } finally {
        button.disabled = false;
        button.removeAttribute("aria-busy");
        if (buttonTitle) buttonTitle.textContent = translate("downloadPatched");
        if (buttonFilename) {
          buttonFilename.hidden = false;
          buttonFilename.textContent = makePatchedFilename(fileInfo, options);
        }
        button.setAttribute("aria-label", translate(
          "ariaDownloadPatched",
          locale === "ja" ? fileInfo.labelJa : fileInfo.labelEn,
          makePatchedFilename(fileInfo, options),
        ));
        updateRenderedRomItems();
      }
    });

    return button;
  }

    main.append(heading, download);
    item.append(main);

    const disclosure = document.createElement("details");
    disclosure.className = "rom-item__disclosure";
    disclosure.open = openDisclosureIds.has(fileInfo.patchId);

    const summary = document.createElement("summary");
    summary.setAttribute("aria-label", locale === "ja"
      ? `${fileInfo.labelJa}の詳細`
      : `Details for ${fileInfo.labelEn}`);
    const summaryLabel = document.createElement("span");
    summaryLabel.dataset.role = "disclosure-label";
    summary.appendChild(summaryLabel);
    disclosure.appendChild(summary);
    updateDisclosureLabel(disclosure);

    disclosure.addEventListener("toggle", () => {
      if (disclosure.open) openDisclosureIds.add(fileInfo.patchId);
      else openDisclosureIds.delete(fileInfo.patchId);
      updateDisclosureLabel(disclosure);
    });

    const details = document.createElement("div");
    details.className = "rom-item__details";

    const otFact = createFact(translate("ot"), fileInfo.ot);
    otFact.querySelector("dt").dataset.i18n = "ot";
    const tidFact = createFact(translate("tid"), String(fileInfo.tid));
    tidFact.querySelector("dt").dataset.i18n = "tid";
    const languageFact = createFact(translate("language"), fileInfo.language);
    languageFact.querySelector("dt").dataset.i18n = "language";
    details.append(otFact, tidFact, languageFact);

    const { unofficial: stateUnofficial, shinyValue } = getRomState(fileInfo);
    const shinyFact = createFact(translate("shinyHunting"), shinyValue);
    shinyFact.querySelector("dt").dataset.i18n = "shinyHunting";
    shinyFact.querySelector("dd").dataset.role = "shiny-value";
    shinyFact.querySelector("dd").classList.add(
      stateUnofficial ? "shiny--unofficial" : fileInfo.shinyHuntable ? "shiny--possible" : "shiny--locked",
    );
    details.append(shinyFact);

    if (fileInfo.supportsShinyUnlock) {
      const options = document.createElement("div");
      options.className = "rom-item__options";

      const checkChoice = document.createElement("label");
      checkChoice.className = "check-choice";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = shinyUnlocked;
      checkbox.setAttribute("aria-describedby", `shiny-detail-${fileInfo.patchId} shiny-warning-${fileInfo.patchId}`);

      const copy = document.createElement("span");
      const title = document.createElement("span");
      title.className = "check-choice__title";
      title.dataset.i18n = "shinyUnlockTitle";
      title.textContent = translate("shinyUnlockTitle");
      const detail = document.createElement("span");
      detail.className = "check-choice__detail";
      detail.dataset.i18n = "shinyUnlockDetail";
      detail.id = `shiny-detail-${fileInfo.patchId}`;
      detail.textContent = translate("shinyUnlockDetail");
      copy.append(title, detail);
      checkChoice.append(checkbox, copy);
      options.appendChild(checkChoice);

      const warning = document.createElement("p");
      warning.className = "patch-warning";
      warning.dataset.role = "shiny-warning";
      warning.id = `shiny-warning-${fileInfo.patchId}`;
      warning.hidden = !shinyUnlocked;
      warning.setAttribute("role", "alert");
      warning.dataset.i18n = "shinyWarning";
      warning.textContent = translate("shinyWarning");
      options.appendChild(warning);

      checkbox.addEventListener("change", () => {
        shinyUnlocked = checkbox.checked;
        if (checkbox.checked) {
          openDisclosureIds.add(fileInfo.patchId);
          disclosure.open = true;
        }
        updateRenderedRomItemState(item, fileInfo);
      });

      details.appendChild(options);
    }

    details.appendChild(createRawDownloadLink(fileInfo, label));
    disclosure.appendChild(details);
    item.appendChild(disclosure);
    return item;
  }

  function updateOutputSummary() {
    if (!elements.outputModeCurrent) return;
    elements.outputModeCurrent.textContent = outputState.mode === "multiboot"
      ? translate("outputModeSummaryMultiboot")
      : translate("outputModeSummaryEmulator");
  }

  function renderResults(focusHeading) {
    elements.results.replaceChildren(...currentRomFiles.map(createRomItem));
    elements.results.classList.add("is-visible");
    elements.resultsSection.hidden = false;
    updateOutputSummary();
    if (focusHeading) elements.resultsHeading.focus();
  }

  function resetInterface(options = {}) {
    if (options.invalidate !== false) processGeneration += 1;
    rawDownloadUrls.forEach((url) => URL.revokeObjectURL(url));
    rawDownloadUrls = [];
    currentRomFiles = [];
    elements.results.replaceChildren();
    elements.results.classList.remove("is-visible");
    elements.resultsSection.hidden = true;
    elements.actions.classList.remove("is-visible");
    elements.filenameLine.classList.remove("is-visible");
    setStatus("");
    elements.fileInput.value = "";
    currentFile = null;
    currentStatusKey = null;
    outputState.mode = "multiboot";
    const defaultOutput = document.querySelector('#output-mode input[value="multiboot"]');
    if (defaultOutput) defaultOutput.checked = true;
    shinyUnlocked = false;
    openDisclosureIds.clear();
    updateOutputSummary();
  }

  async function processDiscImage(file) {
    const generation = ++processGeneration;
    resetInterface({ invalidate: false });
    currentFile = file;
    elements.loadSection.hidden = true;
    elements.filenameLine.textContent = translate("fileSize", file.name, formatFileSize(file.size));
    elements.filenameLine.classList.add("is-visible");

    try {
      await verifyDiscImage(file);
      if (generation !== processGeneration) return;

      currentRomFiles = await extractRomFiles(file);
      if (generation !== processGeneration) return;

      currentRomFiles.forEach((fileInfo) => {
        const rawBlob = new Blob([fileInfo.bytes], { type: "application/octet-stream" });
        fileInfo.rawUrl = URL.createObjectURL(rawBlob);
        rawDownloadUrls.push(fileInfo.rawUrl);
      });

      if (generation !== processGeneration) {
        rawDownloadUrls.forEach((url) => URL.revokeObjectURL(url));
        rawDownloadUrls = [];
        return;
      }

      renderResults(true);
    } catch (error) {
      if (generation !== processGeneration) return;
      const reason = error instanceof Error ? error.message : "unreadable";
      currentStatusKey =
        reason === "not-gamecube"
          ? "notGameCube"
          : reason === "not-pc6e01"
            ? "notPc6e01"
            : reason === "hash-mismatch"
              ? "hashMismatch"
              : "unreadable";
      setStatus(translate(currentStatusKey));
    } finally {
      if (generation === processGeneration) {
        elements.actions.classList.add("is-visible");
      }
    }
  }

  function handleFile(file) {
    if (file) void processDiscImage(file);
  }

  elements.languageButton.addEventListener("click", () => {
    locale = locale === "ja" ? "en" : "ja";
    updateLocalizedText();
  });

  ["dragenter", "dragover"].forEach((eventName) => {
    elements.dropzone.addEventListener(eventName, (event) => {
      event.preventDefault();
      elements.dropzone.classList.add("is-active");
    });
  });

  ["dragleave", "drop"].forEach((eventName) => {
    elements.dropzone.addEventListener(eventName, (event) => {
      event.preventDefault();
      elements.dropzone.classList.remove("is-active");
    });
  });

  elements.dropzone.addEventListener("drop", (event) => {
    handleFile(event.dataTransfer?.files?.[0]);
  });

  elements.dropzone.addEventListener("click", () => elements.fileInput.click());
  elements.fileInput.addEventListener("change", () => handleFile(elements.fileInput.files?.[0]));

  elements.resetButton.addEventListener("click", () => {
    resetInterface();
    elements.loadSection.hidden = false;
    elements.dropzone.focus();
  });

  updateLocalizedText();
  document.documentElement.classList.remove("language-pending");
})();
</script>
</body>
</html>
